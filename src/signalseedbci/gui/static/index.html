<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalSeedBCI</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="toolbar">
  <div class="brand">
    <img class="logo" src="img/logo.png" alt="">
    <div class="brand-text">
      <div class="brand-name">SignalSeedBCI</div>
      <div class="tagline" title="Build, simulate and run brain–computer interface (BCI) experiments">Build, simulate and run brain–computer interface (BCI) experiments</div>
      <div class="credits" title="Made by EMU Lab at Ghent University/Imec">Made by EMU Lab at Ghent University/Imec</div>
    </div>
  </div>
  <div class="group">
    <label for="pipelineSelect" class="data-label">Load a pipeline</label>
    <select id="pipelineSelect" title="Open a pipeline from pipelines/"></select>
    <button id="btnNew" title="New pipeline">New</button>
    <button id="btnSave" title="Save (⌘S)">Save</button>
    <button id="btnSaveAs">Save as…</button>
    <span id="dirtyDot" class="dirty" title="Unsaved changes" hidden>●</span>
  </div>
  <div id="validity" class="validity" title="Validation"></div>
  <div class="spacer"></div>
  <div class="group run">
    <label for="dataSource" class="data-label">Data</label>
    <select id="dataSource" title="Where the pipeline's data comes from when you press Run">
      <optgroup label="Real">
        <option value="live">Amplifier / bridge (live)</option>
      </optgroup>
      <optgroup label="Simulated, real time">
        <option value="replay">Replay a recording</option>
        <option value="synthetic">Synthetic EEG</option>
        <option value="fake-bridge">Simulated ActiveTwo</option>
      </optgroup>
      <optgroup label="Evaluation">
        <option value="offline">Recording, offline (as fast as possible)</option>
      </optgroup>
    </select>
    <select id="dataDetail" hidden></select>
    <span id="runStatus" class="run-status" hidden></span>
    <button id="btnRun" class="primary">▶ Run</button>
    <button id="btnStop" class="danger" hidden>■ Stop</button>
  </div>
</header>

<main class="workspace">
  <aside class="palette">
    <input id="paletteSearch" type="search" placeholder="Search nodes…">
    <div id="paletteList"></div>
    <p class="hint">Drag onto the canvas, or click to add.</p>
  </aside>
  <div class="splitter v" data-panel="pal" title="Drag to resize · double-click to reset · drag shut to hide"></div>

  <section id="canvasWrap" class="canvas-wrap" tabindex="0">
    <div id="canvas" class="canvas">
      <svg id="edges" class="edges"></svg>
      <div id="nodes"></div>
    </div>
    <div class="canvas-tools">
      <button id="btnZoomIn" title="Zoom in">+</button>
      <button id="btnZoomOut" title="Zoom out">−</button>
      <button id="btnFit" title="Fit to view">Fit</button>
      <button id="btnLayout" title="Auto-arrange nodes">Arrange</button>
    </div>
    <div class="legend" id="legend"></div>
  </section>
  <div class="splitter v" data-panel="insp" title="Drag to resize · double-click to reset · drag shut to hide"></div>

  <aside id="inspector" class="inspector"></aside>
</main>

<div class="splitter h" data-panel="bottom" title="Drag to resize · double-click to reset · drag shut to hide"></div>
<section class="bottom" id="bottom">
  <nav class="tabs">
    <button data-tab="console" class="active">Console</button>
    <button data-tab="training" title="Train the pipeline's Classifier nodes on recordings or a live session">Training</button>
    <div class="spacer"></div>
    <button id="btnCollapse" title="Collapse / expand">▾</button>
  </nav>

  <div class="tab-body" data-body="console">
    <div class="proc-list" id="procList"></div>
    <pre class="log" id="log"></pre>
  </div>

  <div class="tab-body training" data-body="training" hidden>
    <div id="trainingPanel" class="cards"></div>
  </div>
</section>

<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="modal-actions">
      <button id="modalCancel">Cancel</button>
      <button id="modalOk" class="primary">OK</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="scope.js"></script>
<script src="eyes.js"></script>
<script src="app.js"></script>
</body>
</html>
