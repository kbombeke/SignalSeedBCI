<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SignalSeedBCI eyes</title>
<link rel="icon" type="image/png" href="img/favicon.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>
  body.eyes-page { display: flex; flex-direction: column; height: 100vh; }
  .eyes-page canvas { flex: 1; width: 100%; min-height: 0; }
  .eyes-bar { display: flex; align-items: center; gap: 12px; padding: 6px 12px; font-size: 12px; color: var(--muted);
              background: var(--panel); border-top: 1px solid var(--border); }
  .eyes-bar label { display: flex; align-items: center; gap: 4px; }
  .eyes-bar .live { color: var(--ok); }
  body.clean .eyes-bar { display: none; }
</style>
</head>
<body class="eyes-page">
<canvas id="cv" title="Double-click: hide/show the bar (for the participant)"></canvas>
<div class="eyes-bar">
  <span id="status">waiting…</span>
  <div class="spacer"></div>
  <label><input type="checkbox" id="graded"> eyelids follow probability</label>
  <label><input type="checkbox" id="showLabel" checked> show label</label>
  <button id="fullscreen">Full screen</button>
</div>
<script src="scope.js"></script>
<script src="eyes.js"></script>
<script>
"use strict";
const q = new URLSearchParams(location.search);
const stream = q.get("stream") || "signalseedbci-eyes";
const closedLabel = q.get("closed") || "closed";
const gazeMode = q.get("mode") === "gaze";
const [upL, downL, leftL, rightL] = (q.get("labels") || "up,down,left,right").split(",");
const holdS = Number(q.get("hold") || 1.5);
const gazeLabels = { up: upL, down: downL, left: leftL, right: rightL };
const say = { [upL]: "looking up", [downL]: "looking down", [leftL]: "looking left", [rightL]: "looking right" };
const $ = (s) => document.querySelector(s);
$("#graded").checked = q.get("graded") === "1";
if (gazeMode) $("#graded").parentElement.lastChild.textContent = " gaze follows probabilities";
document.title = `${stream} · SignalSeedBCI eyes`;
const events = new EventBuffer([stream], 50);
const anim = new EyesAnimator();

async function poll() { await events.poll(); setTimeout(poll, 150); }
function frame() {
  if (gazeMode) return frameGaze();
  const st = eyesStateFrom(events, closedLabel, $("#graded").checked);
  anim.update(st.live ? st.closure : 0);
  const label = !$("#showLabel").checked ? null
    : !st.live ? "waiting for the pipeline…" : st.closure >= 0.5 ? "eyes closed" : "eyes open";
  anim.draw($("#cv"), { dim: !st.live, label });
  const s = $("#status");
  s.textContent = st.live ? `● ${stream}: ${st.label}` + (st.pClosed != null ? ` · P(${closedLabel}) = ${st.pClosed.toFixed(2)}` : "")
                          : `○ no predictions on '${stream}' — run the pipeline`;
  s.className = st.live ? "live" : "";
  requestAnimationFrame(frame);
}
function frameGaze() {
  const st = gazeStateFrom(events, stream, gazeLabels, holdS, $("#graded").checked);
  anim.update(0);
  anim.look(st.dir);
  const label = !$("#showLabel").checked ? null
    : !st.present ? "waiting for the pipeline…" : st.active ? (say[st.label] || st.label) : "looking ahead";
  anim.draw($("#cv"), { dim: !st.present, label });
  const s = $("#status");
  s.textContent = !st.present ? `○ no predictions on '${stream}' — run the pipeline`
    : st.label == null ? `● ${stream}: waiting for the first prediction`
    : `● ${stream}: last ${st.label}` + (st.p != null ? ` (P = ${st.p.toFixed(2)})` : "") + ` · ${st.age.toFixed(1)} s ago`;
  s.className = st.present ? "live" : "";
  requestAnimationFrame(frame);
}

$("#fullscreen").onclick = () => document.documentElement.requestFullscreen?.();
$("#cv").ondblclick = () => document.body.classList.toggle("clean");
poll(); requestAnimationFrame(frame);
</script>
</body>
</html>
