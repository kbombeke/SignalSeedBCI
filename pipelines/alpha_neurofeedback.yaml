# Continuous relative alpha power over posterior channels, published as an LSL
# stream ("signalseedbci-alpha") that a feedback program can read. No training needed.
# Triggers are republished as "signalseedbci-alpha-markers" for the plots.
#
#   signalseedbci run pipelines/alpha_neurofeedback.yaml
#   test data: signalseedbci synth --paradigm alpha-bursts --record data/alpha_bursts_raw.fif --duration 180
name: Alpha neurofeedback

nodes:
  src:
    type: LSLSource
    params: {signal_name: BioSemi, marker_name: BioSemi-Triggers}
  names:
    type: RenameChannels
    params: {preset: biosemi32}
  car:
    type: Rereference
    params: {ref: average}
  posterior:
    type: PickChannels
    params: {include: [O1, Oz, O2, PO3, PO4, Pz]}
  down:
    type: Decimate
    params: {target_sfreq: 256}
  band:
    type: BandpassFilter
    params: {l_freq: 1, h_freq: 40}
  windows:
    type: SlidingWindow
    params: {window_s: 1, step_s: 0.25}
  alpha:
    type: BandPower
    params: {bands: {alpha: [8, 12]}, relative: true, log: false}
  out:
    type: DataVisualizer
    params: {name: signalseedbci-alpha, type: Feedback}
  spectrum:
    type: SpectrumOut
    params: {name: signalseedbci-spectrum, window_s: 2, step_s: 0.25, fmin: 1, fmax: 40}
  eyes:
    type: EyesFeedback
  state:
    type: ThresholdClassifier

edges:
  - src.signal -> names.in
  - names.out -> car.in
  - car.out -> posterior.in
  - posterior.out -> down.in
  - down.out -> band.in
  - band.out -> windows.in
  - windows.out -> alpha.in
  - alpha.out -> out.in
  - src.markers -> out.markers
  - band.out -> spectrum.in
  - src.markers -> spectrum.markers
  - state.out -> eyes.in
  - alpha.out -> state.in

layout:  # node positions in the editor: [x, y] or [x, y, width, view height]
  src: [23, -78]
  names: [294, -98]
  car: [522, -58]
  posterior: [773, -50]
  down: [1035, -58]
  band: [30, 207]
  windows: [285, 215]
  alpha: [535, 201]
  out: [802, 140, 384, 224]
  spectrum: [800, 529, 388, 291]
  eyes: [1270, 585, 499, 310]
  state: [799, 985]
