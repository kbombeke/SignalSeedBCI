# Gaze direction from in-ear EEG (EOG): looking up / down / left / right.
#
# Montage: 12 in-ear electrodes (LC1-3 / RC1-3 concha, LE1-3 / RE1-3 ear canal) and
# references M1 / M2 (mastoids), Fpz (forehead) and Neck. Signals are referenced to the
# neck, which picks up almost no eye activity. Horizontal movements show up as opposite
# shifts on the two ears; vertical ones mostly at the forehead.
#
# Cue markers 1 = up, 2 = down, 3 = left, 4 = right. Per cue, the mean amplitude per
# electrode in two windows after the cue feeds a shrinkage-LDA classifier; GazeFeedback
# shows animated eyes looking in the predicted direction.
#
#   data:   signalseedbci synth --paradigm eye-movements --duration 300 --record data/eye_movements_300s_raw.fif
#   train:  signalseedbci train pipelines/inear_gaze.yaml --data data/eye_movements_300s_raw.fif
#   run:    Data > Synthetic EEG > Eye movements, then Run (or Replay a recording)
name: In-ear gaze direction (EOG)

nodes:
  src:
    type: LSLSource
    params: {signal_name: BioSemi, marker_name: BioSemi-Triggers}
  ref:
    type: Rereference
    params: {ref: [L_MASTOID], drop_ref: true}
  down:
    type: Decimate
    params: {target_sfreq: 128}
  lowpass:
    type: BandpassFilter
    params: {l_freq: null, h_freq: 10, order: 4}
  eog:
    type: LSLSignalOut
    params: {name: signalseedbci-eog, type: EOG, display: none}
  names:
    type: RenameChannels

edges:
  - ref.out -> down.in
  - down.out -> lowpass.in
  - lowpass.out -> eog.in
  - src.markers -> eog.markers
  - src.signal -> names.in
  - names.out -> ref.in

layout:  # node positions in the editor: [x, y] or [x, y, width, view height]
  src: [30, 30]
  ref: [280, 30]
  down: [530, 30]
  lowpass: [780, 30]
  eog: [1212, -187, 1031, 841]
  names: [212, -125]
